services:
  - type: web
    name: movie-streaming-app
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: change-this-password
      - key: STORAGE_PROVIDER
        value: local
      - key: MAX_VIDEO_SIZE_MB
        value: 500
      - key: MAX_POSTER_SIZE_MB
        value: 10
